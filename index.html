    <style>
      /* ---------- abertura (desenhada aqui para aparecer antes do JavaScript) ---------- */
      html { background: #04080c; }
      #splash { position: fixed; inset: 0; z-index: 100; overflow: hidden; cursor: pointer;
        -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
      .no-splash #splash { display: none; }

      /* cortina: duas metades com a grade do site, que se abrem no fim */
      .sp-half { position: absolute; left: 0; right: 0; height: 50.5%; overflow: hidden; background: #02050a;
        transition: transform 0.9s cubic-bezier(0.83, 0, 0.17, 1) 0.12s; }
      .sp-top { top: 0; } .sp-bot { bottom: 0; }
      .sp-half::before, .sp-half::after { content: ""; position: absolute; left: 0; right: 0; height: 100vh; }
      .sp-top::before, .sp-top::after { top: 0; } .sp-bot::before, .sp-bot::after { bottom: 0; }
      .sp-half::before { opacity: 0; animation: sp-in 1s ease 0.05s forwards;
        background-image: linear-gradient(rgba(144, 163, 165, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(144, 163, 165, 0.07) 1px, transparent 1px);
        background-size: 44px 44px; background-position: center center; }
      .sp-half::after { background: radial-gradient(ellipse 75% 60% at 50% 50%, transparent 25%, #02050a 82%); }
      #splash.open .sp-top { transform: translateY(-100%); }
      #splash.open .sp-bot { transform: translateY(100%); }

      /* delta: canais de luz saindo do centro, como os braços do rio */
      .sp-delta { position: absolute; inset: 0; width: 100%; height: 100%; transition: opacity 0.5s; will-change: opacity; }
      .sp-delta path { fill: none; stroke-width: 1.1; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1;
        animation: sp-draw 1.1s cubic-bezier(0.65, 0, 0.35, 1) forwards; animation-delay: calc(0.12s + var(--d) * 1s); }
      .sp-delta .m { stroke: rgba(224, 172, 92, 0.5); }
      .sp-delta .s { stroke: rgba(63, 183, 159, 0.42); stroke-width: 0.9; }
      #splash.open .sp-delta { opacity: 0; }

      /* brilho atrás do monograma */
      .sp-glow { position: absolute; left: 50%; top: 50%; width: 680px; height: 680px; margin: -340px 0 0 -340px;
        border-radius: 50%; opacity: 0; transform: scale(0.35);
        background: radial-gradient(closest-side, rgba(224, 172, 92, 0.2), rgba(63, 183, 159, 0.06) 55%, transparent);
        animation: sp-glow 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards; }
      #splash.open .sp-glow { animation: sp-glow-out 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

      /* centro: anel de carregamento, monograma, nome */
      .sp-mark { position: absolute; inset: 0; transition: opacity 0.45s, transform 0.6s cubic-bezier(0.7, 0, 0.84, 0); }
      #splash.open .sp-mark { opacity: 0; transform: scale(1.14); }
      .sp-core { position: absolute; left: 50%; top: 50%; width: 132px; height: 132px; margin: -66px 0 0 -66px; }
      .sp-core::before { content: ""; position: absolute; inset: 4px; border-radius: 50%;
        background: radial-gradient(closest-side, #02050a 78%, rgba(2, 5, 10, 0)); }
      .sp-text { position: absolute; left: 0; right: 0; top: calc(50% + 92px); display: flex; flex-direction: column; align-items: center; }
      .sp-ring { position: absolute; inset: 0; transform: rotate(-90deg); overflow: visible; }
      .sp-ring circle { fill: none; }
      .sp-track { stroke: rgba(233, 240, 239, 0.08); stroke-width: 1; }
      .sp-prog { stroke: #e0ac5c; stroke-width: 1.5; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1;
        animation: sp-draw 1.55s cubic-bezier(0.45, 0, 0.2, 1) 0.05s forwards; }
      .sp-ticks { stroke: rgba(233, 240, 239, 0.18); stroke-width: 1; opacity: 0; animation: sp-in 0.6s ease 0.2s forwards; }
      .sp-mono { position: absolute; left: 50%; top: 50%; width: 74px; height: 74px; margin: -37px 0 0 -37px;
        filter: drop-shadow(0 0 16px rgba(224, 172, 92, 0.4)); }
      .sp-mono path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: sp-draw 0.38s cubic-bezier(0.65, 0, 0.35, 1) forwards; }
      .sp-mono path:nth-child(1) { animation-delay: 0.3s; }
      .sp-mono path:nth-child(2) { animation-delay: 0.48s; }
      .sp-mono path:nth-child(3) { animation-delay: 0.66s; }
      .sp-dot { transform-origin: 46px 18px; transform: scale(0); animation: sp-pop 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.92s forwards; }

      .sp-name { margin: 0; display: flex; gap: 0.26em; color: #e9f0ef;
        font: 400 clamp(32px, 8.4vw, 46px)/1 "Fraunces", Georgia, serif; letter-spacing: -0.01em;
        text-shadow: 0 0 22px #02050a, 0 0 8px #02050a, 0 0 3px #02050a; }
      .sp-w { display: inline-flex; overflow: hidden; padding: 0.04em 0.02em 0.1em; }
      .sp-w span { display: inline-block; transform: translateY(110%); will-change: transform;
        animation: sp-up 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards; animation-delay: calc(0.72s + var(--i) * 0.035s); }
      .sp-it { font-style: italic; }
      .sp-role { margin: 14px 0 0; opacity: 0; transform: translateY(6px); color: #7c8d90;
        font: 500 10px/1 "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0.32em; text-transform: uppercase; text-shadow: 0 0 10px #02050a, 0 0 4px #02050a;
        animation: sp-rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards; }

      /* cantos */
      .sp-hud > span { position: absolute; color: #6f8184; font: 500 9.5px/1.4 "JetBrains Mono", ui-monospace, monospace;
        letter-spacing: 0.22em; text-transform: uppercase; opacity: 0; animation: sp-in 0.7s ease 0.3s forwards; }
      .sp-hud .tl { top: max(20px, env(safe-area-inset-top)); left: 20px; }
      .sp-hud .tr { top: max(20px, env(safe-area-inset-top)); right: 20px; color: #e0ac5c; }
      .sp-hud .bl { bottom: max(20px, env(safe-area-inset-bottom)); left: 20px; }
      .sp-hud .br { bottom: max(20px, env(safe-area-inset-bottom)); right: 20px; }
      .sp-hud .tl::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 8px; border-radius: 50%;
        background: #3fb79f; vertical-align: 1px; }
      .sp-st { display: inline-grid; }
      .sp-st i { grid-area: 1 / 1; font-style: normal; text-align: right; }
      .sp-st i:last-child { color: #3fb79f; opacity: 0; animation: sp-in 0.3s ease 1.62s forwards; }
      .sp-st i:first-child { animation: sp-out 0.25s ease 1.55s forwards; }
      #splash.open .sp-hud > span { animation: sp-out 0.3s ease forwards; }

      /* contador 000 → 100 sem JavaScript */
      @property --sp-n { syntax: "<integer>"; inherits: false; initial-value: 0; }
      .sp-count { counter-reset: sp var(--sp-n); animation: sp-count 1.55s cubic-bezier(0.45, 0, 0.2, 1) 0.05s forwards; }
      .sp-count::before { content: counter(sp, decimal-leading-zero); }

      /* fenda de luz no instante em que a cortina abre */
      .sp-seam { position: absolute; left: 0; right: 0; top: 50%; height: 1px; opacity: 0; transform: scaleX(0);
        background: linear-gradient(90deg, transparent, #f5c880 30%, #fff4dc 50%, #f5c880 70%, transparent); }
      #splash.open .sp-seam { animation: sp-seam 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

      @keyframes sp-in { to { opacity: 1; } }
      @keyframes sp-out { from { opacity: 1; } to { opacity: 0; } }
      @keyframes sp-draw { to { stroke-dashoffset: 0; } }
      @keyframes sp-up { to { transform: none; } }
      @keyframes sp-rise { to { opacity: 1; transform: none; } }
      @keyframes sp-pop { 60% { transform: scale(1.7); } to { transform: scale(1); } }
      @keyframes sp-count { to { --sp-n: 100; } }
      @keyframes sp-glow { to { opacity: 1; transform: scale(1); } }
      @keyframes sp-glow-out { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(2.6); } }
      @keyframes sp-seam { 0% { opacity: 0; transform: scaleX(0.1); } 30% { opacity: 1; } 100% { opacity: 0; transform: scaleX(1.2); } }

      /* rede de segurança: se o JavaScript não chegar, a cortina some sozinha */
      #splash { animation: sp-fallback 0.6s ease 7s forwards; }
      @keyframes sp-fallback { to { opacity: 0; visibility: hidden; } }
    </style>
