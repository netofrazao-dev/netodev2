    <script>
      // decide antes da primeira pintura: abertura só na primeira visita da sessão
      (function () {
        try {
          var d = document.documentElement;
          var forced = /[?&]movimento/.test(location.search);
          if (forced) d.classList.add("motion-full");
          var reduced = !forced && matchMedia("(prefers-reduced-motion: reduce)").matches;
          if (reduced || sessionStorage.getItem("nf:intro") === "1") d.classList.add("no-splash");
        } catch (e) {}
      })();
    </script>

    <style>
      html { background: #04080c; }
      #splash { position: fixed; inset: 0; z-index: 100; cursor: pointer; }
      .no-splash #splash { display: none; }
      .sp-half { position: absolute; left: 0; right: 0; height: 50.5%; background: #02050a;
        transition: transform 0.85s cubic-bezier(0.83, 0, 0.17, 1) 0.06s; }
      .sp-top { top: 0; } .sp-bot { bottom: 0; }
      #splash.open .sp-top { transform: translateY(-100%); }
      #splash.open .sp-bot { transform: translateY(100%); }
      .sp-seam { position: absolute; left: 0; right: 0; top: 50%; height: 1px; transform: scaleX(0); opacity: 0;
        background: linear-gradient(90deg, transparent, #e0ac5c, transparent);
        animation: sp-seam 0.9s cubic-bezier(0.83, 0, 0.17, 1) 0.15s forwards; }
      #splash.open .sp-seam { animation: sp-seam-out 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .sp-mark { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 62px; transition: opacity 0.4s, transform 0.4s; }
      #splash.open .sp-mark { opacity: 0; transform: scale(0.86); }
      .sp-mark svg { filter: drop-shadow(0 0 18px rgba(224, 172, 92, 0.45)); }
      .sp-mark path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: sp-draw 0.38s cubic-bezier(0.65, 0, 0.35, 1) forwards; }
      .sp-mark path:nth-child(2) { animation-delay: 0.2s; }
      .sp-mark path:nth-child(3) { animation-delay: 0.4s; }
      .sp-dot { transform-origin: 46px 18px; transform: scale(0); animation: sp-pop 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.68s forwards; }
      .sp-label { font: 500 10px/1 ui-monospace, monospace; letter-spacing: 0.3em; text-transform: uppercase; color: #7c8d90; }
      @keyframes sp-draw { to { stroke-dashoffset: 0; } }
      @keyframes sp-pop { 60% { transform: scale(1.6); } to { transform: scale(1); } }
      @keyframes sp-seam { to { transform: scaleX(1); opacity: 0.9; } }
      @keyframes sp-seam-out { from { transform: scaleX(1); opacity: 0.9; } to { transform: scaleX(1.4); opacity: 0; } }
      /* rede de segurança: se o JavaScript não chegar, a cortina some sozinha */
      #splash { animation: sp-fallback 0.6s ease 7s forwards; }
      @keyframes sp-fallback { to { opacity: 0; visibility: hidden; } }
    </style>
